# FluxerMoon: instalador de Windows x64.
# Fichero propio de FluxerMoon (no existe en Moonfin oficial), así que nunca
# da conflictos al fusionar versiones nuevas de upstream.
# Los workflows oficiales de Moonfin siguen en el repo pero desactivados
# desde la configuración de GitHub (gh workflow disable), no editándolos.
name: FluxerMoon Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Mantener igual que FLUTTER_VERSION en .github/workflows/build.yml (oficial).
  FLUTTER_VERSION: '3.47.2'

permissions:
  contents: write  # publicar la versión de prueba en Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Marca de FluxerMoon (nombre, instalador, textos). Ver fluxer/branding.json.
      - name: Apply FluxerMoon branding
        shell: pwsh
        run: |
          python fluxer/apply_branding.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter gen-l10n

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Caché de vcpkg (libarchive + OpenSSL compilados): ahorra ~13 min
      # a partir de la segunda compilación.
      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: '*_Windows_v*.exe'
          if-no-files-found: error

      # Cada compilación manual queda en Releases como versión de prueba
      # (pre-release: el actualizador de la app solo mira la última versión
      # NO de prueba), con enlace de descarga directo.
      - name: Publish test build
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "prueba-${{ github.run_number }}"
          $exe = Get-ChildItem -Filter "*_Windows_v*.exe" | Select-Object -First 1
          gh release create $tag $exe.FullName --target "${{ github.sha }}" --prerelease `
            --title "Prueba ${{ github.run_number }} (Windows)" `
            --notes "Compilación de prueba de ${{ github.sha }}. Instalador sin firmar: en el aviso de Windows, «Más información» → «Ejecutar de todas formas»."
