# FluxerPlayer: instalador de Windows x64.
# Fichero propio de FluxerPlayer (no existe en Moonfin oficial), así que nunca
# da conflictos al fusionar versiones nuevas de upstream.
# Los workflows oficiales de Moonfin siguen en el repo pero desactivados
# desde la configuración de GitHub (gh workflow disable), no editándolos.
#
# - Lanzado a mano (Run workflow): compilación de prueba, publicada como
#   pre-release «Prueba N». El actualizador de la app NO la ve.
# - Etiqueta vX.Y.Z: versión de verdad, con las notas de esa versión en
#   CHANGELOG-FLUXER.md. Es la que el actualizador ofrece a los clientes.
#   La etiqueta tiene que coincidir con fluxer/version.json.
name: FluxerPlayer Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Mantener igual que FLUTTER_VERSION en .github/workflows/build.yml (oficial).
  FLUTTER_VERSION: '3.47.2'
  # Número de compilación: sube solo en cada ejecución (versión = X.Y.Z+N).
  FLUXER_BUILD_NUMBER: ${{ github.run_number }}
  FLUXER_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

permissions:
  contents: write  # publicar en Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Marca y versión de FluxerPlayer. Ver fluxer/branding.json y fluxer/version.json.
      - name: Apply FluxerPlayer branding
        id: brand
        shell: pwsh
        run: |
          python fluxer/apply_branding.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter gen-l10n
          $v = (Get-Content fluxer/version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Caché de vcpkg (libarchive + OpenSSL compilados): ahorra ~13 min
      # a partir de la segunda compilación.
      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: '*_Windows_v*.exe'
          if-no-files-found: error

      - name: Publish test build
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = "${{ github.run_number }}"
          $v = "${{ steps.brand.outputs.version }}"
          $exe = Get-ChildItem -Filter "*_Windows_v*.exe" | Select-Object -First 1
          gh release create "prueba-$n" $exe.FullName --target "${{ github.ref_name }}" --prerelease `
            --title "Prueba $n · $v+$n (Windows)" `
            --notes "Compilación de prueba $v+$n ($env:GITHUB_SHA). No es una versión para clientes: el actualizador de la app no la ofrece. Instalador sin firmar: en el aviso de Windows, «Más información» → «Ejecutar de todas formas»."

      # Notas = la sección «## X.Y.Z …» de CHANGELOG-FLUXER.md.
      - name: Publish release
        if: env.FLUXER_RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.brand.outputs.version }}"
          $lines = Get-Content CHANGELOG-FLUXER.md -Encoding UTF8
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($v))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG-FLUXER.md no tiene la sección ## $v" }
          $title = $lines[$start - 1] -replace '^##\s*', ''
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { break }
            $body += $lines[$i]
          }
          $notes = ($body -join "`n").Trim() + "`n`n---`nWindows: descarga ``FluxerPlayer_Windows_v$v.exe``. Si Windows avisa, «Más información» → «Ejecutar de todas formas»."
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          $exe = Get-ChildItem -Filter "*_Windows_v*.exe" | Select-Object -First 1
          gh release create "$env:FLUXER_RELEASE_TAG" $exe.FullName --verify-tag --latest `
            --title "FluxerPlayer $title" --notes-file release-notes.md
